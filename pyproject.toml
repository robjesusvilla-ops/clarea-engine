[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clarea-engine"
version = "0.1.0"
description = "Open-source Decision Intelligence & Marketing Analytics Engine for Claude & Multi-Agent Systems"
readme = "README.md"
authors = [
  { name = "Robert Villa", email = "robjesusvilla@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0"
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0"
]

[project.scripts]
clarea = "clarea.cli:app"

[tool.setuptools.packages.find]
include = ["clarea*"]

[project.urls]
Homepage = "https://github.com/robjesusvilla-ops/clarea-engine"
Repository = "https://github.com/robjesusvilla-ops/clarea-engine"
Issues = "https://github.com/robjesusvilla-ops/clarea-engine/issues"

